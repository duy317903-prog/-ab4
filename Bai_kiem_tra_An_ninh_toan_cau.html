  }

  }

    font-size: 0.95rem;
    display: none;
  }

// ===================== BIẾN TOÀN CỤC =====================
let questions = JSON.parse(JSON.stringify(originalQuestions));

// ===================== HÀM XỬ LÝ =====================
function renderQuiz() {
  const container = document.getElementById('quiz-container');
  container.innerHTML = '';
  document.getElementById('scoreBox').style.display = 'none';

  let currentSection = '';

  questions.forEach((q, idx) => {
    let section = '';
    if (q.id === 5) section = 'PHẦN I – TRẮC NGHIỆM NHIỀU LỰA CHỌN';
    else if (typeof q.id === 'number' || q.id.toString().startsWith('II')) {
      if (q.id === 12 && currentSection !== 'I') section = 'PHẦN I – TRẮC NGHIỆM NHIỀU LỰA CHỌN';
      else if (q.id.toString().startsWith('II') && currentSection !== 'II') section = 'PHẦN II – TRẮC NGHIỆM ĐÚNG/SAI';
    } else if (q.id.startsWith('TH') && currentSection !== 'TH') section = '2. THÔNG HIỂU';
    else if (q.id.startsWith('VD') && !q.id.startsWith('VDC') && currentSection !== 'VD') section = '3. VẬN DỤNG';
    else if (q.id.startsWith('VDC') && currentSection !== 'VDC') section = '4. VẬN DỤNG CAO';
    else if (q.id.startsWith('TN') && currentSection !== 'TN') section = 'CÂU TRẢ LỜI NGẮN';

    if (section && section !== currentSection) {
      currentSection = section;
      const title = document.createElement('div');
      title.className = 'section-title';
      title.textContent = section;
      container.appendChild(title);
    }

    const card = document.createElement('div');
    card.className = 'question-card' + (q.type === 'short' ? ' short-answer' : '');
    card.id = `q-${idx}`;

    let html = `<div class="q-number">Câu ${q.id}</div>`;
    html += `<div class="q-text">${q.text.replace(/\n/g, '<br>')}</div>`;

    if (q.type === 'short') {
      html += `<textarea id="ans-${idx}" placeholder="Nhập câu trả lời..."></textarea>`;
      html += `<div class="feedback" id="fb-${idx}"></div>`;
    } else {
      html += `<div class="options" id="opts-${idx}">`;
      q.options.forEach((opt, i) => {
        html += `
          <label>
            <input type="radio" name="q${idx}" value="${i}">
            <span>${opt}</span>
          </label>`;
      });
      html += `</div>`;
      html += `<div class="feedback" id="fb-${idx}"></div>`;
    }

    card.innerHTML = html;
    container.appendChild(card);

    if (q.type !== 'short') {
      const labels = card.querySelectorAll('label');
      labels.forEach(label => {
        label.addEventListener('click', () => {
          labels.forEach(l => l.classList.remove('selected'));
          label.classList.add('selected');
        });
      });
    }
  });
}

function shuffleArray(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function shuffleQuestions() {
  questions = shuffleArray([...questions]);
  renderQuiz();
  alert('Đã đảo thứ tự câu hỏi!');
}

function shuffleOptions() {
  questions.forEach((q) => {
    if (q.type === 'short') return;
    const indices = q.options.map((_, i) => i);
    shuffleArray(indices);
    const newOptions = indices.map(i => q.options[i]);
    const newCorrect = indices.indexOf(q.correct);
    q.options = newOptions;
    q.correct = newCorrect;
  });
  renderQuiz();
  alert('Đã đảo thứ tự đáp án trong các câu!');
}

function resetQuiz() {
  questions = JSON.parse(JSON.stringify(originalQuestions));
  renderQuiz();
  alert('Đã reset về thứ tự gốc!');
}

function checkAll() {
  let correctCount = 0;
  let total = 0;

  questions.forEach((q, idx) => {
    total++;
    const fb = document.getElementById(`fb-${idx}`);
    fb.classList.remove('show', 'correct', 'wrong');

    if (q.type === 'short') {
      const val = document.getElementById(`ans-${idx}`).value.trim();
      if (val === q.answer || val === q.answer + ' triệu' || val.includes(q.answer)) {
        fb.textContent = '✅ Đúng! ' + q.explain;
        fb.classList.add('show', 'correct');
        correctCount++;
      } else {
        fb.textContent = '❌ Sai. Đáp án đúng: ' + q.answer + '. ' + q.explain;
        fb.classList.add('show', 'wrong');
      }
    } else {
      const selected = document.querySelector(`input[name="q${idx}"]:checked`);
      const labels = document.querySelectorAll(`#opts-${idx} label`);

      labels.forEach(l => {
        l.classList.remove('correct', 'wrong', 'selected');
      });

      if (!selected) {
        fb.textContent = 'Chưa chọn đáp án';
        fb.classList.add('show', 'wrong');
        labels[q.correct].classList.add('correct');
        return;
      }

      const chosen = parseInt(selected.value);
      if (chosen === q.correct) {
        fb.textContent = '✅ Đúng! ' + q.explain;
        fb.classList.add('show', 'correct');
        labels[chosen].classList.add('correct');
        correctCount++;
      } else {
        fb.textContent = '❌ Sai. ' + q.explain;
        fb.classList.add('show', 'wrong');
        labels[chosen].classList.add('wrong');
        labels[q.correct].classList.add('correct');
      }
    }
  });

  const scoreBox = document.getElementById('scoreBox');
  scoreBox.style.display = 'block';
  scoreBox.innerHTML = `Kết quả: <span style="color:var(--correct)">${correctCount}</span> / ${total} câu đúng`;
  scoreBox.scrollIntoView({ behavior: 'smooth' });
}

// Khởi tạo
renderQuiz();
